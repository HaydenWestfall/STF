<section class="section section--alt reviews">
  <div class="container">
    <div class="section-head section-head--center" stfReveal>
      <span class="eyebrow">Customer reviews</span>
      <h2>What our clients say</h2>
      <p class="lede">
        We have earned a 4.5 out of 5 average rating from the people we insure
        across the Miami Valley.
      </p>
    </div>

    <div class="reviews__grid">
      @for (review of reviews; track review; let i = $index) {
        <figure
          class="card review"
          [stfReveal]="i"
          >
          <div class="review__stars" aria-label="Rated 5 out of 5">★★★★★</div>
          <blockquote>{{ review.review }}</blockquote>
          <figcaption>{{ review.reviewer }}</figcaption>
        </figure>
      }
    </div>

    <div class="reviews__action" stfReveal>
      <a
        class="btn btn--secondary"
        [href]="reviewLink"
        target="_blank"
        rel="noopener"
        >Leave us a review</a
        >
      </div>
    </div>
  </section>
