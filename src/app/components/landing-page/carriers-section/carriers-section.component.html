<section class="section section--tight carriers">
  <div class="container">
    <div class="carriers__head" stfReveal>
      <div>
        <span class="eyebrow">Our carriers</span>
        <h2>Backed by companies you already know</h2>
        <p>
          We place business with more than 20 regional and national carriers, so
          you get the strength of a large company with the service of a local
          office.
        </p>
      </div>
      <a class="btn btn--secondary" routerLink="/carriers"
        >Payments &amp; Claims</a
      >
    </div>
  </div>

  <div class="marquee" aria-hidden="true">
    <div class="marquee__track">
      <div class="marquee__item" *ngFor="let carrier of marqueeCarriers">
        <img [src]="carrier" alt="" loading="lazy" />
      </div>
    </div>
  </div>
</section>
